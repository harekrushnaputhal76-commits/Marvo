<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Apple Siri Fluid Orb Replica</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent !important;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Main Orb Stage */
  .siri-stage {
    position: relative;
    width: 140px;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    perspective: 800px;
  }

  /* Outer Ambient Glow Aura */
  .siri-aura {
    position: absolute;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 229, 255, 0.35) 0%, rgba(255, 0, 127, 0.25) 45%, rgba(75, 0, 130, 0.15) 70%, transparent 85%);
    filter: blur(20px);
    opacity: 0.85;
    transition: transform 0.25s ease-out, opacity 0.3s ease;
    will-change: transform, opacity;
  }

  /* Liquid Mesh Container with massive blur for seamless 3D watermorphism */
  .orb-mesh-container {
    position: relative;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    overflow: visible;
    filter: blur(34px) contrast(145%);
    -webkit-filter: blur(34px) contrast(145%);
    transform: translateZ(0);
    will-change: transform;
    transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1);
  }

  /* 4 Distinct Overlapping Liquid Color Blobs */
  .orb-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    mix-blend-mode: screen;
    will-change: transform, border-radius;
    backface-visibility: hidden;
  }

  /* Layer 1: Electric Siri Cyan */
  .layer-cyan {
    background: radial-gradient(circle at 35% 35%, #00F0FF 0%, #00B4D8 65%, transparent 95%);
    animation: morph-cyan 8s infinite ease-in-out alternate, rotate-clockwise 14s infinite linear;
    opacity: 0.95;
  }

  /* Layer 2: Vivid Siri Magenta */
  .layer-magenta {
    background: radial-gradient(circle at 65% 35%, #FF007F 0%, #E0006C 65%, transparent 95%);
    animation: morph-magenta 9.5s infinite ease-in-out alternate, rotate-counter 16s infinite linear;
    opacity: 0.92;
  }

  /* Layer 3: Deep Royal Violet */
  .layer-violet {
    background: radial-gradient(circle at 50% 70%, #7928CA 0%, #4B0082 65%, transparent 95%);
    animation: morph-violet 11s infinite ease-in-out alternate, rotate-clockwise 18s infinite linear;
    opacity: 0.90;
  }

  /* Layer 4: Intense Glowing White Core */
  .layer-white-core {
    width: 70%;
    height: 70%;
    top: 15%;
    left: 15%;
    background: radial-gradient(circle, #FFFFFF 0%, rgba(255, 255, 255, 0.9) 35%, rgba(0, 240, 255, 0.4) 65%, transparent 95%);
    animation: morph-core 6s infinite ease-in-out alternate, core-breathe 2.8s infinite ease-in-out;
    opacity: 0.96;
  }

  /* Glass Specular Rim Highlight for authentic 3D Apple depth */
  .glass-rim {
    position: absolute;
    width: 112px;
    height: 112px;
    border-radius: 50%;
    border: 1.2px solid rgba(255, 255, 255, 0.38);
    box-shadow: 
      inset 0 1px 3px rgba(255, 255, 255, 0.7),
      inset 0 -2px 6px rgba(0, 0, 0, 0.4),
      0 0 16px rgba(0, 229, 255, 0.35);
    pointer-events: none;
    z-index: 10;
  }

  /* Top Specular Glint */
  .glass-glint {
    position: absolute;
    top: 18px;
    left: 28px;
    width: 32px;
    height: 14px;
    border-radius: 50%;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0) 100%);
    transform: rotate(-25deg);
    filter: blur(1.5px);
    pointer-events: none;
    z-index: 12;
  }

  /* Organic Morphing Keyframes (Fluid Liquid Shape Deformations) */
  @keyframes morph-cyan {
    0% {
      border-radius: 40% 60% 65% 35% / 40% 45% 55% 60%;
      transform: scale(1);
    }
    33% {
      border-radius: 65% 35% 45% 55% / 55% 60% 40% 45%;
      transform: scale(1.06);
    }
    66% {
      border-radius: 50% 50% 30% 70% / 30% 35% 65% 70%;
      transform: scale(0.96);
    }
    100% {
      border-radius: 45% 55% 60% 40% / 60% 40% 60% 40%;
      transform: scale(1.02);
    }
  }

  @keyframes morph-magenta {
    0% {
      border-radius: 60% 40% 35% 65% / 55% 40% 60% 45%;
      transform: scale(1.02);
    }
    50% {
      border-radius: 35% 65% 60% 40% / 40% 60% 40% 60%;
      transform: scale(0.95);
    }
    100% {
      border-radius: 55% 45% 40% 60% / 60% 35% 65% 40%;
      transform: scale(1.05);
    }
  }

  @keyframes morph-violet {
    0% {
      border-radius: 50% 50% 40% 60% / 45% 55% 45% 55%;
      transform: scale(0.98);
    }
    50% {
      border-radius: 70% 30% 60% 40% / 35% 65% 35% 65%;
      transform: scale(1.07);
    }
    100% {
      border-radius: 40% 60% 50% 50% / 65% 35% 65% 35%;
      transform: scale(0.97);
    }
  }

  @keyframes morph-core {
    0% {
      border-radius: 45% 55% 50% 50% / 50% 45% 55% 50%;
    }
    50% {
      border-radius: 55% 45% 60% 40% / 45% 55% 45% 55%;
    }
    100% {
      border-radius: 50% 50% 45% 55% / 55% 50% 50% 45%;
    }
  }

  @keyframes rotate-clockwise {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes rotate-counter {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
  }

  @keyframes core-breathe {
    0%, 100% { transform: scale(0.88); opacity: 0.88; }
    50% { transform: scale(1.12); opacity: 1.0; }
  }

  /* ---- STATE-SPECIFIC ANIMATIONS ---- */

  /* IDLE State */
  .state-idle .orb-mesh-container {
    animation: idle-float 4.2s infinite ease-in-out;
  }
  @keyframes idle-float {
    0%, 100% { transform: scale(0.96) translateY(0); }
    50% { transform: scale(1.02) translateY(-2px); }
  }

  /* LISTENING State: Audio Reactive Pulsing */
  .state-listening .layer-cyan {
    animation-duration: 4.5s, 8s;
  }
  .state-listening .layer-magenta {
    animation-duration: 5s, 9s;
  }
  .state-listening .layer-white-core {
    animation-duration: 3s, 1.4s;
    opacity: 1.0;
  }

  /* THINKING State: Rapid Rotation & Intense Shimmer */
  .state-thinking .layer-cyan {
    animation: morph-cyan 3s infinite ease-in-out alternate, rotate-clockwise 4.5s infinite linear !important;
  }
  .state-thinking .layer-magenta {
    animation: morph-magenta 3.2s infinite ease-in-out alternate, rotate-counter 5s infinite linear !important;
  }
  .state-thinking .layer-violet {
    animation: morph-violet 3.5s infinite ease-in-out alternate, rotate-clockwise 5.5s infinite linear !important;
  }
  .state-thinking .layer-white-core {
    transform: scale(1.22);
    opacity: 1.0;
    filter: drop-shadow(0 0 10px #FFFFFF);
  }
  .state-thinking .siri-aura {
    transform: scale(1.18);
    opacity: 1.0;
  }

  /* SPEAKING State: Warm Voice Rhythm */
  .state-speaking .orb-mesh-container {
    animation: speaking-pulse 1.3s infinite ease-in-out;
  }
  @keyframes speaking-pulse {
    0%, 100% { transform: scale(0.98); }
    50% { transform: scale(1.08); }
  }
</style>
</head>
<body class="state-idle">

<div class="siri-stage" id="siriStage">
  <!-- Outer Ambient Glow Aura -->
  <div class="siri-aura" id="siriAura"></div>

  <!-- 3D Liquid Mesh Gradient (Apple Siri Replica) -->
  <div class="orb-mesh-container" id="orbMesh">
    <div class="orb-layer layer-cyan"></div>
    <div class="orb-layer layer-magenta"></div>
    <div class="orb-layer layer-violet"></div>
    <div class="orb-layer layer-white-core"></div>
  </div>

  <!-- Glass Specular Depth Overlays -->
  <div class="glass-rim"></div>
  <div class="glass-glint"></div>
</div>

<script>
// ============================================================
// SIRI FLUID ORB BRIDGE (Java <-> WebView)
// States: IDLE, LISTENING, THINKING, SPEAKING
// ============================================================

const body = document.body;
const orbMesh = document.getElementById('orbMesh');
const siriAura = document.getElementById('siriAura');

let currentState = 'IDLE';
let currentAmplitude = 0.0;
let targetAmplitude = 0.0;

// JavaScript Bridge API for Native Android AssistantActivity
window.setOrbState = function(state) {
  if (!state) return;
  const s = state.toUpperCase().trim();
  currentState = s;
  
  body.className = '';
  switch (s) {
    case 'LISTENING':
      body.classList.add('state-listening');
      break;
    case 'THINKING':
      body.classList.add('state-thinking');
      break;
    case 'SPEAKING':
      body.classList.add('state-speaking');
      break;
    default:
      body.classList.add('state-idle');
      break;
  }
};

window.setAmplitude = function(amp) {
  targetAmplitude = Math.max(0.0, Math.min(1.0, parseFloat(amp) || 0.0));
};

// Smooth Audio Reactivity Render Loop
function updateAudioReactivity() {
  currentAmplitude += (targetAmplitude - currentAmplitude) * 0.22;

  if (currentState === 'LISTENING') {
    const scale = 1.0 + currentAmplitude * 0.38;
    orbMesh.style.transform = `scale(${scale.toFixed(3)}) translateZ(0)`;
    siriAura.style.transform = `scale(${(scale * 1.1).toFixed(3)})`;
    siriAura.style.opacity = (0.75 + currentAmplitude * 0.25).toFixed(2);
  } else if (currentState === 'SPEAKING') {
    const scale = 1.0 + currentAmplitude * 0.22;
    orbMesh.style.transform = `scale(${scale.toFixed(3)}) translateZ(0)`;
  } else {
    orbMesh.style.transform = '';
    siriAura.style.transform = '';
  }

  requestAnimationFrame(updateAudioReactivity);
}
requestAnimationFrame(updateAudioReactivity);

// Initialize as IDLE
window.setOrbState('IDLE');
</script>
</body>
</html>
