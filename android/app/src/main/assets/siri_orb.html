<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Apple Siri Fluid Orb Replica</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: visible;
    background: transparent !important;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Isolation stage to guarantee clean screen blending on transparent background */
  .orb-stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    isolation: isolate;
  }

  /* Step 2/20: True Apple Siri Blurred Metaball Mesh Gradient Wrapper */
  .siri-orb {
    position: relative;
    width: 160px;
    height: 160px;
    filter: blur(25px) contrast(1.5);
    -webkit-filter: blur(25px) contrast(1.5);
    mix-blend-mode: screen;
    background: transparent;
    transform: translateZ(0);
    will-change: transform;
    transition: transform 0.15s cubic-bezier(0.2, 0.9, 0.3, 1);
  }

  /* Liquid Metaball Blobs Base */
  .blob {
    position: absolute;
    border-radius: 50%;
    will-change: transform;
    backface-visibility: hidden;
  }

  /* 1. Electric Siri Cyan Blob (#00E5FF) */
  .blob-cyan {
    width: 90px;
    height: 90px;
    top: 20px;
    left: 15px;
    background: radial-gradient(circle, #00E5FF 0%, rgba(0, 229, 255, 0.85) 60%, transparent 100%);
    opacity: 0.95;
    animation: morph-cyan 7s infinite ease-in-out alternate;
  }

  /* 2. Vivid Siri Magenta Blob (#FF007F) */
  .blob-magenta {
    width: 95px;
    height: 95px;
    top: 15px;
    right: 15px;
    background: radial-gradient(circle, #FF007F 0%, rgba(255, 0, 127, 0.85) 60%, transparent 100%);
    opacity: 0.92;
    animation: morph-magenta 8.5s infinite ease-in-out alternate;
  }

  /* 3. Deep Royal Violet Blob (#4B0082) */
  .blob-violet {
    width: 105px;
    height: 105px;
    bottom: 10px;
    left: 28px;
    background: radial-gradient(circle, #7928CA 0%, #4B0082 65%, transparent 100%);
    opacity: 0.90;
    animation: morph-violet 10s infinite ease-in-out alternate;
  }

  /* 4. Glowing White Core Blob (#FFFFFF) */
  .blob-white {
    width: 65px;
    height: 65px;
    top: 48px;
    left: 48px;
    background: radial-gradient(circle, #FFFFFF 0%, rgba(255, 255, 255, 0.95) 45%, rgba(0, 229, 255, 0.4) 75%, transparent 100%);
    opacity: 0.98;
    animation: pulse-core 4.5s infinite ease-in-out alternate;
  }

  /* Organic Morphing Keyframes (Fluid translation & scaling) */
  @keyframes morph-cyan {
    0% {
      transform: translate(0px, 0px) scale(1);
    }
    30% {
      transform: translate(25px, -15px) scale(1.18, 0.85);
    }
    60% {
      transform: translate(-15px, 25px) scale(0.88, 1.2);
    }
    85% {
      transform: translate(15px, 20px) scale(1.1, 0.95);
    }
    100% {
      transform: translate(-10px, -10px) scale(1.05, 1.1);
    }
  }

  @keyframes morph-magenta {
    0% {
      transform: translate(0px, 0px) scale(1);
    }
    25% {
      transform: translate(-28px, 15px) scale(0.85, 1.22);
    }
    55% {
      transform: translate(18px, 20px) scale(1.2, 0.85);
    }
    80% {
      transform: translate(-12px, -20px) scale(1.05, 1.1);
    }
    100% {
      transform: translate(15px, -10px) scale(0.95, 1.05);
    }
  }

  @keyframes morph-violet {
    0% {
      transform: translate(0px, 0px) scale(1.02);
    }
    33% {
      transform: translate(-22px, -22px) scale(1.12, 0.88);
    }
    66% {
      transform: translate(25px, -15px) scale(0.85, 1.18);
    }
    100% {
      transform: translate(-15px, 15px) scale(1.08, 0.92);
    }
  }

  @keyframes pulse-core {
    0% {
      transform: translate(0px, 0px) scale(0.92);
      opacity: 0.92;
    }
    40% {
      transform: translate(10px, -8px) scale(1.18);
      opacity: 1.0;
    }
    75% {
      transform: translate(-8px, 10px) scale(0.88);
      opacity: 0.88;
    }
    100% {
      transform: translate(5px, 5px) scale(1.08);
      opacity: 0.96;
    }
  }

  /* ---- ASSISTANT STATE-SPECIFIC ANIMATIONS ---- */

  /* IDLE State */
  .state-idle .siri-orb {
    animation: orb-idle 5s infinite ease-in-out;
  }
  @keyframes orb-idle {
    0%, 100% { transform: scale(0.96) translateY(0); }
    50% { transform: scale(1.03) translateY(-3px); }
  }

  /* LISTENING State */
  .state-listening .blob-cyan {
    animation-duration: 4.5s;
  }
  .state-listening .blob-magenta {
    animation-duration: 5s;
  }
  .state-listening .blob-violet {
    animation-duration: 6s;
  }
  .state-listening .blob-white {
    animation-duration: 2.8s;
  }

  /* THINKING State: Rapid Swirl & Higher Contrast/Glow */
  .state-thinking .siri-orb {
    filter: blur(20px) contrast(1.7);
    -webkit-filter: blur(20px) contrast(1.7);
    animation: thinking-spin 6s infinite linear;
  }
  @keyframes thinking-spin {
    from { transform: rotate(0deg) scale(1.05); }
    to { transform: rotate(360deg) scale(1.05); }
  }
  .state-thinking .blob-cyan {
    animation-duration: 2.2s;
  }
  .state-thinking .blob-magenta {
    animation-duration: 2.5s;
  }
  .state-thinking .blob-violet {
    animation-duration: 2.8s;
  }
  .state-thinking .blob-white {
    animation-duration: 1.6s;
    opacity: 1.0;
  }

  /* SPEAKING State: Harmonic Voice Pulse */
  .state-speaking .siri-orb {
    animation: speaking-pulse 1.4s infinite ease-in-out;
  }
  @keyframes speaking-pulse {
    0%, 100% { transform: scale(0.97); }
    50% { transform: scale(1.07); }
  }
</style>
</head>
<body class="state-idle">

<div class="orb-stage">
  <!-- Blurred Metaball Mesh Gradient (Step 2/20: True 3D Siri Orb Replica) -->
  <div class="siri-orb" id="siriOrb">
    <div class="blob blob-cyan"></div>
    <div class="blob blob-magenta"></div>
    <div class="blob blob-violet"></div>
    <div class="blob blob-white"></div>
  </div>
</div>

<script>
// ============================================================
// STEP 2/20: SIRI FLUID METABALL ORB BRIDGE (Java <-> WebView)
// States: IDLE, LISTENING, THINKING, SPEAKING
// ============================================================

const body = document.body;
const siriOrb = document.getElementById('siriOrb');

let currentState = 'IDLE';
let currentAmplitude = 0.0;
let targetAmplitude = 0.0;

// JavaScript Bridge API for Native Android AssistantActivity
window.setOrbState = function(state) {
  if (!state) return;
  const s = state.toUpperCase().trim();
  currentState = s;
  
  body.className = '';
  switch (s) {
    case 'LISTENING':
      body.classList.add('state-listening');
      break;
    case 'THINKING':
      body.classList.add('state-thinking');
      break;
    case 'SPEAKING':
      body.classList.add('state-speaking');
      break;
    default:
      body.classList.add('state-idle');
      break;
  }
};

window.setAmplitude = function(amp) {
  targetAmplitude = Math.max(0.0, Math.min(1.0, parseFloat(amp) || 0.0));
};

// Smooth Audio Reactivity Render Loop
function updateAudioReactivity() {
  currentAmplitude += (targetAmplitude - currentAmplitude) * 0.22;

  if (currentState === 'LISTENING') {
    const scale = 1.0 + currentAmplitude * 0.38;
    siriOrb.style.transform = `scale(${scale.toFixed(3)}) translateZ(0)`;
  } else if (currentState === 'SPEAKING') {
    const scale = 1.0 + currentAmplitude * 0.22;
    siriOrb.style.transform = `scale(${scale.toFixed(3)}) translateZ(0)`;
  } else if (currentState !== 'THINKING') {
    siriOrb.style.transform = '';
  }

  requestAnimationFrame(updateAudioReactivity);
}
requestAnimationFrame(updateAudioReactivity);

// Initialize as IDLE
window.setOrbState('IDLE');
</script>
</body>
</html>
