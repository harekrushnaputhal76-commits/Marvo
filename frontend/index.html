<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Marvo — AI Assistant</title>

<!-- PWA & Mobile Native App Standalone Configuration -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marvo">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══════════ SIDEBAR ═══════════ -->
<aside id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-brand">MARVO</span>
    <button id="btnCloseSidebar" class="sidebar-close" aria-label="Close">&times;</button>
  </div>

  <button id="btnNewChat" class="sidebar-btn new-chat-btn">
    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/></svg>
    New Chat
  </button>

  <div class="sidebar-section">
    <span class="sidebar-section-title">THINKING MODE</span>
    <div class="mode-selector" id="modeSelector">
      <button class="mode-btn" data-mode="fast">Fast</button>
      <button class="mode-btn active" data-mode="medium">Medium</button>
      <button class="mode-btn" data-mode="high">High</button>
    </div>
  </div>

  <div class="sidebar-section sidebar-history">
    <span class="sidebar-section-title">HISTORY</span>
    <ul id="chatHistoryList" class="history-list">
      <!-- Dynamically populated -->
    </ul>
  </div>
</aside>

<!-- ═══════════ CHAT HISTORY CONTEXT MENU ═══════════ -->
<div id="historyContextMenu" class="dropdown-menu history-context-menu">
  <button class="dropdown-item" id="btnRenameChat">
    <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 20h9" stroke="currentColor" stroke-width="2"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    Rename
  </button>
  <button class="dropdown-item danger" id="btnDeleteChat">
    <svg viewBox="0 0 24 24" width="14" height="14"><polyline points="3 6 5 6 21 6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    Delete
  </button>
</div>

<!-- ═══════════ SIDEBAR OVERLAY ═══════════ -->
<div id="sidebarOverlay" class="sidebar-overlay"></div>

<!-- ═══════════ MAIN CONTAINER ═══════════ -->
<main class="main">

  <!-- Top Bar -->
  <header class="topbar">
    <button id="btnHamburger" class="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <span class="topbar-title" id="topbarTitle">Marvo</span>
    <div class="topbar-mode-badge" id="modeBadge">Medium</div>

    <!-- Main App Menu (Top Right 3-Dots) -->
    <div class="menu-container topbar-menu-container">
      <button id="btnAppMenu" class="btn-icon" aria-label="More Options">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="5" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="19" r="2" fill="currentColor"/></svg>
      </button>
      <div id="appDropdown" class="dropdown-menu app-dropdown">
        <button class="dropdown-item" id="btnThemeDark">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          Dark Theme
        </button>
        <button class="dropdown-item" id="btnThemeLight">
          <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2"/></svg>
          Light Theme
        </button>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item" id="btnSettings">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" fill="currentColor"/></svg>
          Settings
        </button>
      </div>
    </div>
  </header>

  <!-- ═══════════ AVATAR ZONE ═══════════ -->
  <div id="avatarZone" class="avatar-zone">
    <div id="face" class="face state-idle">
      <div class="eye-row">
        <!-- Left Eye -->
        <div class="eye-socket">
          <div class="eye">
            <div class="eye-outer-ring"></div>
            <div class="eye-iris">
              <div class="eye-iris-pattern"></div>
              <div class="eye-pupil"><div class="eye-pupil-core"></div></div>
              <div class="eye-highlight h1"></div>
              <div class="eye-highlight h2"></div>
            </div>
            <div class="eyelid eyelid-top"></div>
            <div class="eyelid eyelid-bottom"></div>
            <div class="scan-line"></div>
          </div>
        </div>
        <!-- Right Eye -->
        <div class="eye-socket">
          <div class="eye">
            <div class="eye-outer-ring"></div>
            <div class="eye-iris">
              <div class="eye-iris-pattern"></div>
              <div class="eye-pupil"><div class="eye-pupil-core"></div></div>
              <div class="eye-highlight h1"></div>
              <div class="eye-highlight h2"></div>
            </div>
            <div class="eyelid eyelid-top"></div>
            <div class="eyelid eyelid-bottom"></div>
            <div class="scan-line"></div>
          </div>
        </div>
      </div>
      <div class="state-label" id="stateLabel">IDLE</div>
    </div>
  </div>

  <!-- ═══════════ CHAT AREA ═══════════ -->
  <div id="chatArea" class="chat-area">
    <div id="chatMessages" class="chat-messages">
      <!-- Messages rendered here -->
    </div>
  </div>

  <!-- ═══════════ INPUT BAR ═══════════ -->
  <div class="input-bar">
    <div class="input-glass">

      <!-- Attachment Menu (Far Left) -->
      <div class="attach-container">
        <button id="btnAttach" class="btn btn-attach" aria-label="Attachment">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/></svg>
        </button>
        <div id="attachMenu" class="dropdown-menu attach-menu">
          <button class="dropdown-item attach-item" data-type="Photo">
            <svg viewBox="0 0 24 24" width="16" height="16"><rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><path d="M21 15l-5-5L5 21" stroke="currentColor" stroke-width="2" fill="none"/></svg>
            Photo
          </button>
          <button class="dropdown-item attach-item" data-type="Files">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="14 2 14 8 20 8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            Files
          </button>
          <button class="dropdown-item attach-item" data-type="PDF">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z" fill="none" stroke="currentColor" stroke-width="2"/><text x="7" y="16" font-size="6" font-weight="bold" fill="currentColor">PDF</text></svg>
            PDF
          </button>
          <button class="dropdown-item attach-item" data-type="Text File">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="none" stroke="currentColor" stroke-width="2"/><line x1="8" y1="13" x2="16" y2="13" stroke="currentColor" stroke-width="2"/><line x1="8" y1="17" x2="13" y2="17" stroke="currentColor" stroke-width="2"/></svg>
            Text File
          </button>
          <button class="dropdown-item attach-item" data-type="Code File">
            <svg viewBox="0 0 24 24" width="16" height="16"><polyline points="16 18 22 12 16 6" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="8 6 2 12 8 18" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            Code File
          </button>
        </div>
      </div>

      <input type="text" id="msgInput" placeholder="Ask Marvo anything..." autocomplete="off" spellcheck="false">

      <button id="btnSend" class="btn btn-send" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="currentColor"/></svg>
      </button>

      <button id="btnMic" class="btn btn-mic" aria-label="Voice">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z" fill="currentColor"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" fill="currentColor"/></svg>
      </button>

      <!-- Live Screen Share (Right next to Mic) -->
      <button id="btnScreenShare" class="btn btn-screen" aria-label="Live Screen Share" title="Live Screen Share">
        <svg viewBox="0 0 24 24" width="18" height="18"><rect x="2" y="3" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><line x1="8" y1="21" x2="16" y2="21" stroke="currentColor" stroke-width="2"/><line x1="12" y1="17" x2="12" y2="21" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
  </div>
</main>

<!-- ═══════════ SETTINGS MODAL (Voice Selection) ═══════════ -->
<div id="settingsModal" class="settings-modal-overlay">
  <div class="settings-modal">
    <div class="settings-header">
      <h3 class="settings-title">Settings</h3>
      <button id="btnCloseSettings" class="btn-icon" aria-label="Close Settings">&times;</button>
    </div>
    <div class="settings-body">
      <!-- Category: Voices -->
      <div class="settings-section">
        <h4 class="settings-section-title">VOICES</h4>
        <div class="voice-options-list">
          
          <label class="voice-option-item" for="voice_1">
            <input type="radio" id="voice_1" name="marvoVoiceRadio" value="voice_1">
            <div class="voice-info">
              <span class="voice-name">Swara</span>
              <span class="voice-desc">Sweet Female (Hindi)</span>
            </div>
            <button type="button" class="btn-voice-sample" data-voice="voice_1" aria-label="Play Sample" title="Play Sample">
              <svg viewBox="0 0 24 24" width="16" height="16"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor"/></svg>
            </button>
          </label>

          <label class="voice-option-item" for="voice_2">
            <input type="radio" id="voice_2" name="marvoVoiceRadio" value="voice_2">
            <div class="voice-info">
              <span class="voice-name">Madhur</span>
              <span class="voice-desc">Professional Male (Hindi)</span>
            </div>
            <button type="button" class="btn-voice-sample" data-voice="voice_2" aria-label="Play Sample" title="Play Sample">
              <svg viewBox="0 0 24 24" width="16" height="16"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor"/></svg>
            </button>
          </label>

          <label class="voice-option-item" for="voice_3">
            <input type="radio" id="voice_3" name="marvoVoiceRadio" value="voice_3">
            <div class="voice-info">
              <span class="voice-name">Aria</span>
              <span class="voice-desc">Smart Female (US English)</span>
            </div>
            <button type="button" class="btn-voice-sample" data-voice="voice_3" aria-label="Play Sample" title="Play Sample">
              <svg viewBox="0 0 24 24" width="16" height="16"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor"/></svg>
            </button>
          </label>

          <label class="voice-option-item" for="voice_4">
            <input type="radio" id="voice_4" name="marvoVoiceRadio" value="voice_4">
            <div class="voice-info">
              <span class="voice-name">Ryan</span>
              <span class="voice-desc">Deep Male (UK English)</span>
            </div>
            <button type="button" class="btn-voice-sample" data-voice="voice_4" aria-label="Play Sample" title="Play Sample">
              <svg viewBox="0 0 24 24" width="16" height="16"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor"/></svg>
            </button>
          </label>

          <label class="voice-option-item" for="voice_5">
            <input type="radio" id="voice_5" name="marvoVoiceRadio" value="voice_5">
            <div class="voice-info">
              <span class="voice-name">Natasha</span>
              <span class="voice-desc">Energetic Female (AU English)</span>
            </div>
            <button type="button" class="btn-voice-sample" data-voice="voice_5" aria-label="Play Sample" title="Play Sample">
              <svg viewBox="0 0 24 24" width="16" height="16"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor"/></svg>
            </button>
          </label>

        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════ VOICE OVERLAY ═══════════ -->
<div id="voiceOverlay" class="voice-overlay">
  <div class="voice-modal">
    <div class="voice-rings">
      <div class="voice-ring r1"></div>
      <div class="voice-ring r2"></div>
      <div class="voice-ring r3"></div>
      <div class="voice-mic-icon">
        <svg viewBox="0 0 24 24" width="36" height="36"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z" fill="currentColor"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" fill="currentColor"/></svg>
      </div>
    </div>
    <span class="voice-label">Listening...</span>
    <button id="btnVoiceCancel" class="voice-cancel">Cancel</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
