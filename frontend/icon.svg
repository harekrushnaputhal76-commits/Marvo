<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#081428"/>
      <stop offset="100%" stop-color="#000206"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#88eeff"/>
      <stop offset="45%" stop-color="#00aaff"/>
      <stop offset="85%" stop-color="#0055bb"/>
      <stop offset="100%" stop-color="#001833"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#aae6ff"/>
      <stop offset="100%" stop-color="#00aaff"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#00aaff" stroke-width="6" opacity="0.3" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#00aaff" stroke-width="4" opacity="0.7"/>
  <circle cx="256" cy="256" r="142" fill="none" stroke="#00d4ff" stroke-width="2" stroke-dasharray="14 10" opacity="0.85"/>
  <circle cx="256" cy="256" r="115" fill="url(#iris)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="75" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <circle cx="256" cy="256" r="46" fill="#001224"/>
  <circle cx="256" cy="256" r="28" fill="url(#core)" filter="url(#glow)"/>
  <ellipse cx="230" cy="216" rx="22" ry="12" fill="#ffffff" opacity="0.8" transform="rotate(-30 230 216)"/>
  <circle cx="282" cy="290" r="7" fill="#ffffff" opacity="0.55"/>
</svg>

