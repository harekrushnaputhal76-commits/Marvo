<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="kiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2d3" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#54a0ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ssHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48dbfb"/>
      <stop offset="100%" stop-color="#0abde3"/>
    </linearGradient>
    <filter id="ultraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Super Saiyan Blue / Ultra Instinct Ki Aura -->
  <circle cx="100" cy="100" r="95" fill="url(#kiGlow)"/>
  <circle cx="100" cy="100" r="88" fill="#04121a" stroke="#00d2d3" stroke-width="2" stroke-opacity="0.5"/>
  
  <!-- Massive Saiyan Spiky Hair -->
  <polygon points="100,10 120,40 145,15 142,50 175,35 160,70 185,75 160,95 168,125 145,115 145,80 100,70 55,80 55,115 32,125 40,95 15,75 40,70 25,35 58,50 55,15 80,40" fill="url(#ssHair)" stroke="#ffffff" stroke-width="1.5"/>
  
  <!-- Forehead Bangs -->
  <polygon points="85,65 92,92 100,68" fill="url(#ssHair)" stroke="#ffffff" stroke-width="1"/>
  <polygon points="102,68 110,95 118,65" fill="url(#ssHair)" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Face Shape -->
  <path d="M64,90 L136,90 L132,135 C128,162 116,172 100,175 C84,172 72,162 68,135 Z" fill="#ffeaa7"/>
  
  <!-- Sharp Saiyan Brows -->
  <polygon points="66,102 96,112 94,116 66,107" fill="#0abde3"/>
  <polygon points="134,102 104,112 106,116 134,107" fill="#0abde3"/>
  
  <!-- Ultra Instinct / SS Blue Eyes -->
  <g filter="url(#ultraGlow)">
    <polygon points="70,111 92,116 88,123 72,121" fill="#ffffff" stroke="#00d2d3" stroke-width="2"/>
    <circle cx="82" cy="118" r="3" fill="#00d2d3"/>
    
    <polygon points="130,111 108,116 112,123 128,121" fill="#ffffff" stroke="#00d2d3" stroke-width="2"/>
    <circle cx="118" cy="118" r="3" fill="#00d2d3"/>
  </g>
  
  <!-- Nose and Battle Smile -->
  <polygon points="98,124 102,124 105,138 98,138" fill="#e17055"/>
  <path d="M88,152 Q100,158 112,152" stroke="#2d3436" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>

