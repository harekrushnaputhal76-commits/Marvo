<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="wolvGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd32a" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#05c46b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wolvMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdd59"/>
      <stop offset="100%" stop-color="#ffa801"/>
    </linearGradient>
    <filter id="adamantiumGleam" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#wolvGlow)"/>
  <circle cx="100" cy="100" r="88" fill="#141416" stroke="#ffdd59" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Classic Winged Black Fins -->
  <path d="M30,35 C42,75 55,115 58,135 C50,110 40,80 30,35 Z" fill="#1e272e" stroke="#485460" stroke-width="1.5"/>
  <path d="M170,35 C158,75 145,115 142,135 C150,110 160,80 170,35 Z" fill="#1e272e" stroke="#485460" stroke-width="1.5"/>
  <path d="M42,50 C55,85 70,110 75,120 L60,110 Z" fill="#0be881" opacity="0.2"/>
  
  <!-- Yellow Cowl Helmet -->
  <path d="M60,65 C60,40 140,40 140,65 L142,120 C142,150 125,172 100,176 C75,172 58,150 58,120 Z" fill="url(#wolvMask)" stroke="#ff5e57" stroke-width="1.5"/>
  
  <!-- Black Eye Wing Panels -->
  <path d="M52,80 L88,105 L96,115 L88,120 L58,125 Z" fill="#1e272e"/>
  <path d="M148,80 L112,105 L104,115 L112,120 L142,125 Z" fill="#1e272e"/>
  
  <!-- White Slit Eyes -->
  <polygon points="68,105 88,112 84,116 66,110" fill="#ffffff" stroke="#00d8d6" stroke-width="1.5"/>
  <polygon points="132,105 112,112 116,116 134,110" fill="#ffffff" stroke="#00d8d6" stroke-width="1.5"/>
  
  <!-- Mouth Cutout / Berserker Snarl -->
  <path d="M78,136 C82,130 118,130 122,136 L118,162 C110,166 90,166 82,162 Z" fill="#d7a177"/>
  <path d="M82,148 C90,144 110,144 118,148 C112,158 88,158 82,148 Z" fill="#3c1012"/>
  <!-- Sharp Teeth -->
  <polygon points="86,147 90,152 94,147" fill="#ffffff"/>
  <polygon points="106,147 110,152 114,147" fill="#ffffff"/>
</svg>
