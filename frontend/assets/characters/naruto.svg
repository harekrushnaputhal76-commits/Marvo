  <circle cx="81" cy="119" r="3.5" fill="#0984e3"/>
  <circle cx="82" cy="118" r="1" fill="#ffffff"/>
  
  <polygon points="130,112 110,116 114,124 128,122" fill="#ffffff" stroke="#ff9f1a" stroke-width="2"/>
  <circle cx="119" cy="119" r="3.5" fill="#0984e3"/>
  <circle cx="118" cy="118" r="1" fill="#ffffff"/>
  
  <!-- Whiskers on Cheeks -->
  <line x1="66" y1="130" x2="78" y2="131" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
  <line x1="65" y1="136" x2="77" y2="136" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
  <line x1="67" y1="142" x2="79" y2="141" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
  
  <line x1="134" y1="130" x2="122" y2="131" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
  <line x1="135" y1="136" x2="123" y2="136" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
  <line x1="133" y1="142" x2="121" y2="141" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Confident Grin -->
  <path d="M85,152 Q100,160 115,152" stroke="#d63031" stroke-width="2" fill="none" stroke-linecap="round"/>
