<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="chakraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9f1a" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#ff3838" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="yellowHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff200"/>
      <stop offset="100%" stop-color="#ff9f1a"/>
    </linearGradient>
  </defs>
  <!-- Nine-Tails / Sage Chakra Glow -->
  <circle cx="100" cy="100" r="95" fill="url(#chakraGlow)"/>
  <circle cx="100" cy="100" r="88" fill="#140a05" stroke="#ff9f1a" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Spiky Yellow Ninja Hair -->
  <polygon points="100,20 115,45 135,28 138,55 160,45 152,72 170,68 155,95 160,115 145,115 142,85 100,75 58,85 55,115 40,115 45,95 30,68 48,72 40,45 62,55 65,28 85,45" fill="url(#yellowHair)" stroke="#e58e26" stroke-width="1.5"/>
  
