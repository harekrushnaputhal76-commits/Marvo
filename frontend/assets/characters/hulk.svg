<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="gammaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#0d3b1e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hulkSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="60%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#0b3d0b"/>
    </linearGradient>
    <filter id="gammaNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Gamma Aura -->
  <circle cx="100" cy="100" r="95" fill="url(#gammaGlow)"/>
  <circle cx="100" cy="100" r="88" fill="#051408" stroke="#00ff66" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Muscular Head & Jaw Shape -->
  <path d="M45,85 C40,40 160,40 155,85 L160,135 C160,170 145,182 100,185 C55,182 40,170 40,135 Z" fill="url(#hulkSkin)" stroke="#00ff66" stroke-width="2"/>
  
  <!-- Black Messy Hair -->
  <path d="M40,75 C45,35 75,25 100,25 C125,25 155,35 160,75 C150,60 135,50 120,55 C110,48 90,48 80,55 C65,50 50,60 40,75 Z" fill="#111811"/>
  <polygon points="75,55 85,68 95,54 105,68 115,55 125,70 145,62 135,78 65,78" fill="#111811"/>
  
  <!-- Angry Heavy Brow Ridge -->
  <path d="M55,95 L95,108 L105,108 L145,95 L135,88 L100,98 L65,88 Z" fill="#0b3d0b"/>
  
  <!-- Glowing Fierce Gamma Eyes -->
  <g filter="url(#gammaNeon)">
    <polygon points="68,102 92,109 88,114 66,108" fill="#ffffff" stroke="#00ff66" stroke-width="2"/>
    <polygon points="132,102 108,109 112,114 134,108" fill="#ffffff" stroke="#00ff66" stroke-width="2"/>
  </g>
  
  <!-- Nose and Snarl Lines -->
  <polygon points="95,116 105,116 108,132 92,132" fill="#0e4414"/>
  <path d="M72,136 C80,128 120,128 128,136" stroke="#0b3d0b" stroke-width="3" fill="none"/>
  
  <!-- Gritting Teeth / Smashing Jaw -->
  <path d="M68,145 C80,140 120,140 132,145 C125,165 75,165 68,145 Z" fill="#ffffff" stroke="#0b3d0b" stroke-width="2"/>
  <line x1="100" y1="142" x2="100" y2="158" stroke="#0b3d0b" stroke-width="2"/>
  <line x1="84" y1="143" x2="84" y2="155" stroke="#0b3d0b" stroke-width="1.5"/>
  <line x1="116" y1="143" x2="116" y2="155" stroke="#0b3d0b" stroke-width="1.5"/>
</svg>
