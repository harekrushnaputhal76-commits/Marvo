<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="cyberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyberFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181926"/>
      <stop offset="100%" stop-color="#0e0f17"/>
    </linearGradient>
    <filter id="glitchGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Cyber Matrix Glow -->
  <circle cx="100" cy="100" r="95" fill="url(#cyberGlow)"/>
  <circle cx="100" cy="100" r="88" fill="#0b0c14" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="8,4"/>
  
  <!-- Cybernetic Skull / Visor Head -->
  <path d="M56,60 C56,35 144,35 144,60 L148,110 C148,150 130,172 100,176 C70,172 52,150 52,110 Z" fill="url(#cyberFace)" stroke="#ff007f" stroke-width="2"/>
  
  <!-- Neon Tech Visor (Wraparound VR / Netrunner) -->
  <g filter="url(#glitchGlow)">
    <polygon points="46,92 154,92 144,118 56,118" fill="#00f0ff" opacity="0.85"/>
    <line x1="46" y1="105" x2="154" y2="105" stroke="#ffffff" stroke-width="2"/>
    <line x1="60" y1="98" x2="140" y2="98" stroke="#ff007f" stroke-width="1.5"/>
    <line x1="70" y1="112" x2="130" y2="112" stroke="#ffe600" stroke-width="1.5"/>
  </g>
  
  <!-- Cyber Circuit Trace Lines -->
  <polyline points="70,40 70,65 90,65" fill="none" stroke="#00f0ff" stroke-width="1.5"/>
  <circle cx="90" cy="65" r="2.5" fill="#00f0ff"/>
  
  <polyline points="130,40 130,65 110,65" fill="none" stroke="#ff007f" stroke-width="1.5"/>
  <circle cx="110" cy="65" r="2.5" fill="#ff007f"/>
  
  <polyline points="55,130 75,130 85,150" fill="none" stroke="#ffe600" stroke-width="1.5"/>
  <circle cx="85" cy="150" r="2.5" fill="#ffe600"/>
  
  <!-- Respirator / Cyber Mouth Grille -->
  <rect x="80" y="140" width="40" height="22" rx="4" fill="#0a0a0f" stroke="#00f0ff" stroke-width="1.5"/>
  <line x1="88" y1="145" x2="88" y2="157" stroke="#ff007f" stroke-width="2"/>
  <line x1="96" y1="144" x2="96" y2="158" stroke="#00f0ff" stroke-width="2"/>
  <line x1="104" y1="144" x2="104" y2="158" stroke="#00f0ff" stroke-width="2"/>
  <line x1="112" y1="145" x2="112" y2="157" stroke="#ff007f" stroke-width="2"/>
</svg>
