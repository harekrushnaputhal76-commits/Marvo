<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="batGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a69bd" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#1e272e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="batCowl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="50%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0f0f14"/>
    </linearGradient>
    <filter id="batEyes" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Dark Knight Aura -->
  <circle cx="100" cy="100" r="95" fill="url(#batGlow)"/>
  <circle cx="100" cy="100" r="88" fill="#08080c" stroke="#4a69bd" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Bat Ears and Cowl -->
  <path d="M50,40 L65,85 L135,85 L150,40 L140,95 C145,130 135,170 100,175 C65,170 55,130 60,95 Z" fill="url(#batCowl)" stroke="#34495e" stroke-width="2"/>
  
  <!-- Nose Guard -->
  <polygon points="94,105 106,105 100,126" fill="#121218"/>
  
  <!-- Exposed Lower Face Cutout -->
  <path d="M78,132 C82,126 118,126 122,132 L118,162 C110,166 90,166 82,162 Z" fill="#d7a177" stroke="#1a1a24" stroke-width="2"/>
  <!-- Stubbled Chin & Stern Lips -->
  <line x1="88" y1="148" x2="112" y2="148" stroke="#795548" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="94" y1="156" x2="106" y2="156" stroke="#5d4037" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- White Slit Lenses (Stalker / Detective Mode) -->
  <g filter="url(#batEyes)">
    <polygon points="72,106 94,113 90,118 72,112" fill="#ffffff" stroke="#70a1ff" stroke-width="1.5"/>
    <polygon points="128,106 106,113 110,118 128,112" fill="#ffffff" stroke="#70a1ff" stroke-width="1.5"/>
  </g>
  
  <!-- Tactical Cowl Seams -->
  <line x1="72" y1="92" x2="95" y2="104" stroke="#34495e" stroke-width="1.5"/>
  <line x1="128" y1="92" x2="105" y2="104" stroke="#34495e" stroke-width="1.5"/>
</svg>

